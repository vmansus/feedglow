version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedglow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: feedglow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "feedglow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FeedGlow API Server (Feed Engine)
  feedglow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://feedglow:${DB_PASSWORD}@postgres/feedglow
      JWT_SECRET: ${JWT_SECRET}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AUTO_SUMMARIZE: ${AUTO_SUMMARIZE:-false}
    ports:
      - "3001:3001"

  # FeedGlow Web App (Next.js)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into Next.js at build time for rewrites proxy
        API_PROXY_URL: http://feedglow:3001
    restart: unless-stopped
    depends_on:
      - feedglow
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"

  # Ollama (Optional - local AI)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    profiles:
      - local-ai

  # RSSHub (Optional - extended subscriptions)
  rsshub:
    image: diygod/rsshub:chromium-bundled
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: 300
    ports:
      - "1200:1200"
    profiles:
      - extended

volumes:
  postgres_data:
  ollama_data:

networks:
  default:
    name: feedglow
