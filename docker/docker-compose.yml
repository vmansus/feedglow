version: '3.8'

services:
  # PostgreSQL Database (shared by Miniflux and FeedGlow)
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedglow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: feedglow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "feedglow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Miniflux RSS Engine
  miniflux:
    image: miniflux/miniflux:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://feedglow:${DB_PASSWORD}@postgres/feedglow?sslmode=disable
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      POLLING_FREQUENCY: 15
      BATCH_SIZE: 10
      POLLING_SCHEDULER: entry_frequency
      SCHEDULER_ENTRY_FREQUENCY_MAX_INTERVAL: 1440
      WEBHOOK_URL: http://feedglow:3001/api/webhook/miniflux
    ports:
      - "8080:8080"

  # FeedGlow API Server
  feedglow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      - postgres
      - miniflux
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://feedglow:${DB_PASSWORD}@postgres/feedglow
      MINIFLUX_URL: http://miniflux:8080
      MINIFLUX_API_KEY: ${MINIFLUX_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AUTO_SUMMARIZE: ${AUTO_SUMMARIZE:-false}
    ports:
      - "3001:3001"

  # FeedGlow Web App (Next.js)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - feedglow
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://feedglow:3001
    ports:
      - "3000:3000"

  # Ollama (Optional - local AI)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    profiles:
      - local-ai
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # RSSHub (Optional - extended subscriptions)
  rsshub:
    image: diygod/rsshub:chromium-bundled
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: 300
    ports:
      - "1200:1200"
    profiles:
      - extended

volumes:
  postgres_data:
  ollama_data:

networks:
  default:
    name: feedglow
