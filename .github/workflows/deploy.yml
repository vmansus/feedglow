name: Deploy FeedGlow

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Deploy Webhook
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '{"ref":"refs/heads/${{ github.ref_name }}","pusher":{"name":"github-actions"}}' | openssl dgst -sha256 -hmac '${{ secrets.WEBHOOK_SECRET }}' | awk '{print $2}')" \
            -d '{"ref":"refs/heads/${{ github.ref_name }}","pusher":{"name":"github-actions"}}' \
            https://feedglow.vmansus.top/hooks/deploy)
          
          echo "Webhook response: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Deploy triggered!"
          else
            echo "❌ Webhook failed with status $RESPONSE"
            exit 1
          fi

      - name: Health Check
        run: |
          sleep 30
          curl -sf https://feedglow.vmansus.top/health && echo "✅ API OK" || echo "⚠️ API check failed"
